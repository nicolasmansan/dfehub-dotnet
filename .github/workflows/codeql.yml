name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.1xx

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        run: dotnet restore DFeHub.slnx

      - name: Build
        run: dotnet build DFeHub.slnx --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.4

